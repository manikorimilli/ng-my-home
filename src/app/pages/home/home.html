<div class="home-container">
    <section>
        <form>
            <input type="text" placeholder="Filter by city" #filter />
            <button type="button" (click)="filterResults(filter.value)">Submit</button>
        </form>
    </section>

    <section>
        @for (homeDetail of filteredDetails(); track homeDetail.id) {
        <app-homes-list [homeDetails]="homeDetail">
        </app-homes-list>
        }
    </section>
</div>
